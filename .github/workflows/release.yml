name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release PR opened with GITHUB_TOKEN never triggers other workflows,
      # so CI does not run on it and branch protection blocks the merge. A
      # GitHub App token opens it as the App, and CI runs like on any PR.
      # Without the App configured this step is skipped and GITHUB_TOKEN is
      # used, as before.
      - name: Create release App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 renamed every input; the v1 names are silently ignored —
          # including the token, which v2 reads from `github-token`, not env.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
        env:
          NPM_CONFIG_PROVENANCE: true
